<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=1920, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; media-src 'self' https: blob:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Nghe</title><link rel="icon" href="icon.png"><link rel="stylesheet" href="style.css"></head>
<body>
<main id="browse" class="browse">
  <header class="top">
    <h1 class="brand">Nghe</h1>
    <button id="now" class="now" hidden aria-label="Đang phát"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span id="now-title"></span></button>
    <button id="search-action" class="search-action" aria-label="Tìm" title="Tìm"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 21 21"></path></svg></button>
    <time id="clock" class="clock"></time>
  </header>
  <nav id="tabs" class="tabs" aria-label="Chuyên mục"></nav>
  <div id="search-bar" class="search-bar" hidden><input id="search-input" type="search" placeholder="Tìm nguồn hoặc bài nghe" aria-label="Tìm nguồn hoặc bài nghe" autocomplete="off"></div>
  <section id="sources" class="sources" aria-label="Nguồn"></section>
  <p class="browse-hint">OK trên nguồn: tùy chọn · → trên bài: tùy chọn</p>
  <section class="episodes">
    <h2 id="list-title" class="list-title"></h2>
    <div id="list" class="list" role="list" tabindex="-1"></div>
  </section>
  <p id="mode" class="mode"></p>
</main>
<section id="player" class="player" hidden tabindex="-1" aria-label="Đang nghe">
  <div id="backdrop" class="backdrop"></div>
  <div class="stage">
    <div id="cover" class="cover"></div>
    <div class="meta">
      <p id="p-source" class="eyebrow"></p>
      <h2 id="p-title" class="p-title"></h2>
      <div class="bar"><i id="p-fill"></i></div>
      <p class="times"><span id="p-time">0:00</span><span id="p-state"></span><span id="p-dur">0:00</span></p>
      <div id="player-controls" class="player-controls">
        <button id="seek-back-action" class="player-action" aria-label="Tua lùi 15 giây" title="Tua lùi 15 giây"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 2 7M4 5v5h5"></path><text x="12" y="16" text-anchor="middle">15</text></svg></button>
        <button id="play-action" class="player-action" aria-label="Tạm dừng" title="Phát hoặc tạm dừng"><svg id="icon-play" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M8 5v14l11-7z"></path></svg><svg id="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"></path></svg></button>
        <button id="seek-forward-action" class="player-action" aria-label="Tua tới 15 giây" title="Tua tới 15 giây"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10a8 8 0 1 0-2 7M20 5v5h-5"></path><text x="12" y="16" text-anchor="middle">15</text></svg></button>
        <button id="sleep-action" class="sleep-action" aria-label="Hẹn giờ" aria-haspopup="dialog" aria-expanded="false" title="Hẹn giờ"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 8v5l3 2M9 2h6"></path></svg></button></div>
      <p class="hint">OK tạm dừng · ‹ › tua 15 giây · ▾ chọn hẹn giờ · Back về danh sách</p>
    </div>
  </div>
  <p id="p-sleep" class="sleep" hidden></p>
  <div id="sleep-menu" class="sleep-menu" hidden role="dialog" aria-label="Hẹn giờ dừng phát">
    <div class="sleep-menu-card"><p>Hẹn giờ</p><div id="sleep-options"></div></div>
  </div>
  <p class="whisper"><span id="w-title"></span><span id="w-time"></span></p>
</section>
<div id="actions" class="actions-overlay" hidden role="dialog" aria-label="Tùy chọn"><div class="actions-panel"><p id="actions-title"></p><div id="actions-list"></div></div></div>
<div id="sleep-black" class="sleep-black" hidden aria-label="Màn hình đen khi ngủ"></div>
<audio id="audio" preload="none"></audio>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="feeds.js"></script><script src="search.js"></script><script src="images.js"></script><script src="player.js"></script><script src="library.js"></script><script src="organize.js"></script><script src="app.js"></script>
</body></html>
